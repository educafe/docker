apiVersion: v1
kind: ConfigMap
metadata:
    name: myconfig
data:
    nginx.conf: |-

        events {
        }

        http {
            upstream myapp {
                server 127.0.0.1:5000;
            }

            server {
                listen 80;
                location / {
                    proxy_pass         http://myapp;
                    proxy_redirect     off;
                }
            }
        }
    
---
apiVersion: v1
kind: Pod
metadata:
    name: nginx-myapp
    labels:
        educafe: mc-myapp
spec:
    containers:
    - name: myapp
      image: educafe/myapp:v1
    - name: nginx
      image: educafe/mynginx:v1
      ports:
      - containerPort: 80
      volumeMounts:
      - name: nginx-proxy-config
        mountPath: /etc/nginx/nginx.conf
        subPath: nginx.conf
    volumes:
    - name: nginx-proxy-config
      configMap:
        name: myconfig
            
    terminationGracePeriodSeconds: 0
      